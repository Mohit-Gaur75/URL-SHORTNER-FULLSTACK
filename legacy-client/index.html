<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>🔗 URL Shortener</h1>
    <p>Paste your long URL below</p>

    <input type="text" id="longUrl" placeholder="https://example.com" />
    <input type="text" id="customCode" placeholder="Custom short code (optional)" />

    <button id="shortenBtn">Shorten URL</button>

    <div id="result" class="hidden">
      <p>Your short URL:</p>
      <a id="shortUrl" target="_blank"></a>
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
